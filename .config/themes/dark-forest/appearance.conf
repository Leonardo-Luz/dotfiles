#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 08
    gaps_out = 10

    border_size = 02

    no_focus_fallback = true

    col.active_border = rgba(99999999) rgba(00000099) 45deg
    col.inactive_border = rgba(ffffff22)

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 8
    rounding_power = 3

    active_opacity = 1.0 # 0.9
    inactive_opacity = 0.8 # 0.6

    dim_inactive = true
    dim_strength = 0.01

    shadow {
        enabled = true
        range = 8
        render_power = 4
        color = rgba(00000077)
        # color = rgba(7a847877)
    }

    blur {
        enabled = false
        size = 1
        passes = 2
        noise = 0.5
        vibrancy = 1.0
    }
}

animations {
    enabled = yes, please :)

    bezier = myBezier, 0.10, 0.9, 0.1, 1.05

    animation = windows, 1, 1, myBezier, slide
    animation = windowsOut, 1, 1, myBezier, slide
    animation = border, 1, 10, default
    animation = fade, 1, 2, default
    animation = workspaces, 1, 3, default
}

# dwindle {
#     pseudotile = true
#     preserve_split = true
# }

master {
    new_status = master
}

cursor {
    inactive_timeout = 1
}

misc {
    force_default_wallpaper = 0
    focus_on_activate = true
    disable_hyprland_logo = true
}
