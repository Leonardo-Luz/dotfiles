# /etc/throttled.conf
# Throttled configuration for Lenovo LOQ 15IRX9 (i7-13620H)
# Allows CPU to properly boost beyond base clocks

[sysfs]
Sysfs_Power_Path: /sys/class/power_supply/ADP0/online

[power_limits]
PL1_Tdp_W: 80
PL2_Tdp_W: 140

[under-volt]
# Safe undervolt values (adjust if unstable)
Core: -50
GPU: -50
Cache: -50
Uncore: -50
AnalogIO: -50
