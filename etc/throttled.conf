# /etc/throttled.conf
# Throttled configuration for Lenovo LOQ 15IRX9 (i5-13450HX)
# Allows CPU to properly boost beyond base clocks
#
# NOTE: Undervolting is locked by default on LOQ laptops.
# To enable undervolting, you must unlock it in the Advanced BIOS by disabling:
#   1. CPU Lock Configuration
#   2. Overclocking Lock
#   3. Undervolt Protection
# Accessing the Advanced BIOS requires an external tool:
#   https://github.com/Thomashighbaugh/Lenovo-Legion-Advanced-Bios/
# Until then, the [under-volt] section below will have no effect.

[sysfs]
Sysfs_Power_Path: /sys/class/power_supply/ADP0/online

[power_limits]
PL1_Tdp_W: 65
PL2_Tdp_W: 115

[under-volt]
# Uncomment after unlocking in Advanced BIOS
# Start with -50 and adjust if unstable
#Core: -50
#GPU: -50
#Cache: -50
#Uncore: -50
#AnalogIO: -50
